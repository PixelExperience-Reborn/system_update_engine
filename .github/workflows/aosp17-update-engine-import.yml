name: Import exact official AOSP17 update_engine with verified OTA policy

on:
  push:
    branches:
      - port/a17-update-engine-import-20261103
    paths:
      - .github/workflows/aosp17-update-engine-import.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aosp17-update-engine-import
  cancel-in-progress: false

jobs:
  import-official-aosp17:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SOURCE_SHA: 4591637f51644f5429f9e2fe589ab22b92f61842
      SOURCE_TREE: 9eb8e796382bcd0b4366526766ccd08d15503ab2
      TARGET_BRANCH: port/a17-update-engine-aosp17-base-20261103
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch official Google Android17 update_engine exact tag
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aosp-update-engine"
          cd "$RUNNER_TEMP/aosp-update-engine"
          git init -q
          git remote add aosp https://android.googlesource.com/platform/system/update_engine
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none \
            aosp refs/tags/android-17.0.0_r1
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$SOURCE_SHA"
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$SOURCE_TREE"
          git cat-file -e "$SOURCE_TREE^{tree}"
          echo "PASS: official update_engine commit/tree verified"

      - name: Publish separate exact-tree snapshot without recovery signature bypasses
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/aosp-update-engine"
          git remote add publish "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          ref="refs/heads/$TARGET_BRANCH"
          existing="$(git ls-remote --heads publish "$ref" | cut -f1)"
          if [ -n "$existing" ]; then
            git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none publish "$ref"
            test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$SOURCE_TREE" || {
              echo "Unexpected target branch contents, refusing overwrite"
              exit 1
            }
            echo "PASS: already published, tree matches AOSP17"
            exit 0
          fi
          export GIT_AUTHOR_NAME="PixelExperience-Reborn CI"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          snapshot="$(printf 'update_engine: verified official Android17 r1 source snapshot\n\nOriginal commit: %s\nExact Git tree: %s\nNo Git ancestry or old PE signature/downgrade bypasses are imported.\n' \
            "$SOURCE_SHA" "$SOURCE_TREE" | git commit-tree "$SOURCE_TREE")"
          test "$(git rev-parse "$snapshot^{tree}")" = "$SOURCE_TREE"
          git -c protocol.version=2 push --no-thin publish "$snapshot:$ref"
          test "$(git ls-remote --heads publish "$ref" | cut -f1)" = "$snapshot"
          echo "PASS: exact AOSP17 update_engine tree snapshot: $snapshot"
